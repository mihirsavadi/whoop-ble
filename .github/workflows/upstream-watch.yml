name: upstream-watch

# Weekly canary for the Goose upstream (b-nnett/goose). If the upstream
# revives, pushes commits, or a fork becomes active, this opens/comments
# an issue in THIS repo (label: upstream-watch) — so anyone watching
# whoop-ble gets pinged. Also runnable manually via workflow_dispatch.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # commit the state file
  issues: write     # open/comment the notification issue

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check upstream
        id: check
        run: python .github/scripts/upstream_check.py

      - name: Create notification issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-watch --color 0e8a16 \
            --description "Automated canary: activity in the upstream Goose repo" || true
          EXISTING=$(gh issue list --label upstream-watch --state open \
                     --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file .github/upstream-report.md
          else
            gh issue create \
              --title "Upstream Goose activity detected — check for new protocol knowledge" \
              --label upstream-watch \
              --body-file .github/upstream-report.md
          fi

      - name: Commit updated state
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-state.json
          git commit -m "upstream-watch: state update (automated)" || exit 0
          git push
